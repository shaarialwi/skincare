<!DOCTYPE html>
<html lang="ms">
<head>

  <meta name="theme-color" content="#f7f8fd" />

  <title>Product Match — Iklan Interaktif</title>
  <style>
    :root {
      --primary: #6c56ec;
      --primary-deep: #4631be;
      --primary-soft: #ece8ff;
      --ink: #1c2037;
      --muted: #70758d;
      --line: #e7e8f2;
      --surface: #ffffff;
      --canvas: #f7f8fd;
      --mint: #d9faec;
      --radius: 24px;
      --shadow: 0 24px 65px rgba(44, 36, 102, .09);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-height: 100vh; background: var(--canvas); color: var(--ink); font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; line-height: 1.5; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .48; transform: none !important; }
    button:focus-visible, a:focus-visible { outline: 3px solid var(--primary); outline-offset: 4px; }
    a { color: inherit; }
    .wrap { width: min(1120px, calc(100% - 36px)); margin: 0 auto; }
    .nav { min-height: 92px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }

    .brand-icon { width: 45px; height: 45px; display: grid; place-items: center; border-radius: 14px; background: var(--primary); color: #fff; box-shadow: 0 10px 24px rgba(108,86,236,.23); font-size: 20px; }
    .brand-icon img { width: 100%; height: 100%; object-fit: contain; border-radius: inherit; }
    .brand small { display: block; color: var(--muted); letter-spacing: 1.9px; text-transform: uppercase; font-size: 9px; font-weight: 800; }
    .pill { display: inline-flex; align-items: center; gap: 7px; border: 1px solid #e6e4f3; background: #fff; border-radius: 999px; padding: 9px 13px; color: #595677; font-size: 12px; font-weight: 760; }
    .dot { width: 7px; height: 7px; background: #36caa0; border-radius: 50%; box-shadow: 0 0 0 4px #e3faef; }
    #app { min-height: 530px; }
    .hero { display: grid; grid-template-columns: 1.05fr .95fr; gap: 30px; align-items: center; padding: 28px 0 44px; }
    .hero-copy { padding: 30px 0 30px 4px; }
    .eyebrow { color: var(--primary); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; font-weight: 900; margin: 0 0 20px; }
    h1,h2,h3,p { margin-top: 0; }
    .hero h1 { max-width: 670px; font-size: clamp(43px, 5.3vw, 72px); line-height: 1.075; letter-spacing: -3.6px; margin-bottom: 23px; font-weight: 900; }
    .gradient-text { background: linear-gradient(115deg, var(--primary) 12%, #bc78ed 85%); color: transparent; background-clip: text; -webkit-background-clip: text; }
    .hero-lead { max-width: 465px; font-size: 17px; color: var(--muted); margin-bottom: 29px; }
    .btn { border: 0; min-height: 54px; padding: 15px 23px; border-radius: 15px; font-weight: 800; display: inline-flex; justify-content: center; align-items: center; gap: 12px; text-decoration: none; transition: transform .22s ease, box-shadow .22s ease, background .22s ease; }
    .btn:not(:disabled):hover { transform: translateY(-3px); }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 14px 30px rgba(108,86,236,.24); }
    .btn-primary:hover { box-shadow: 0 19px 38px rgba(108,86,236,.31); }
    .btn-dark { background: #22263e; color: white; }
    .btn-outline { border: 1px solid #ddddeb; background: white; color: var(--ink); }
    .btn-whatsapp { background: #1ebc77; color: white; box-shadow: 0 12px 28px rgba(12,171,103,.2); }
    .subtext { margin-top: 15px; color: #8d90a2; font-size: 12px; }
    .hero-art { min-height: 490px; position: relative; display: grid; place-items: center; overflow: hidden; border-radius: 34px; isolation: isolate; background: radial-gradient(circle at 80% 20%, #b5f2e7 0, transparent 36%), radial-gradient(circle at 20% 80%, #f9d5ea 0, transparent 40%), linear-gradient(145deg,#dfdcff,#f5e9fb 65%,#dff8ef); box-shadow: var(--shadow); }
    .hero-art::before { content: ""; position: absolute; width: 390px; height: 390px; border-radius: 50%; border: 1px solid rgba(255,255,255,.8); box-shadow: 0 0 0 47px rgba(255,255,255,.17),0 0 0 95px rgba(255,255,255,.11); }
    .hero-top-label { position: absolute; top: 27px; left: 26px; font-weight: 850; color: #62599a; font-size: 11px; letter-spacing: 2.5px; }
    .bottle { position: relative; z-index: 1; width: 162px; height: 252px; margin-top: -12px; filter: drop-shadow(18px 28px 19px rgba(84,63,139,.18)); transform: rotate(-9deg); animation: float 5s ease-in-out infinite; }
    .bottle-cap { width: 71px; height: 57px; position: absolute; left: 46px; top: 0; border-radius: 13px 13px 6px 6px; background: linear-gradient(90deg,#b2a4ed,#ecdcff 48%,#a68fd5); box-shadow: inset -8px 0 9px #a591d077; }
    .bottle-body { position: absolute; top: 52px; width: 162px; height: 200px; border-radius: 25px 25px 30px 30px; background: linear-gradient(100deg, #d8bff6, #fffbff 42%, #d8cbf3); border: 3px solid #fefaff; box-shadow: inset -14px -9px 22px #c8b9e088; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; }
    .bottle-body strong { font-size: 17px; letter-spacing: 1px; }
    .bottle-body span { font-size: 10px; color: #8273a8; letter-spacing: 1.2px; font-weight: 800; }
    .bottle-body i { display: block; width: 46px; height: 1px; background: #ab9bc7; }
    .float-card { position: absolute; z-index: 2; background: rgba(255,255,255,.94); border: 1px solid rgba(255,255,255,.9); border-radius: 20px; padding: 15px 17px; box-shadow: 0 16px 38px rgba(73,59,126,.12); backdrop-filter: blur(12px); }
    .float-match { right: 19px; bottom: 39px; min-width: 182px; transform: rotate(3deg); }
    .float-match strong { display: block; font-size: 38px; letter-spacing: -2px; color: var(--primary); line-height: 1.1; }
    .float-match small, .float-small small { color: #777c97; font-weight: 700; font-size: 11px; }
    .float-small { left: 16px; top: 115px; display: flex; gap: 9px; align-items: center; transform: rotate(-6deg); }
    .float-small span { background: #ecf9f3; color: #28aa7b; border-radius: 10px; padding: 9px; font-size: 18px; }
    .instructions { display: grid; grid-template-columns: repeat(3,1fr); gap: 13px; margin-bottom: 58px; }
    .instruction { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 17px; display: flex; align-items: center; gap: 12px; }
    .step-number { display: grid; place-items: center; width: 35px; height: 35px; border-radius: 12px; background: var(--primary-soft); color: var(--primary); flex: 0 0 35px; font-weight: 900; }
    .instruction strong { font-size: 13px; display: block; }
    .instruction small { color: var(--muted); font-size: 11px; }
    .section-center { max-width: 790px; margin: 18px auto 75px; }
    .section-heading { text-align: center; margin: 0 auto 25px; }
    .section-heading .eyebrow { margin-bottom: 8px; }
    .section-heading h2 { font-size: clamp(26px,4vw,39px); letter-spacing: -1.3px; margin: 0 0 8px; }
    .section-heading p { color: var(--muted); font-size: 14px; }
    .quiz-card, .result-card { background: #fff; border: 1px solid #eeedf5; box-shadow: var(--shadow); border-radius: 28px; padding: clamp(22px, 4vw, 39px); animation: appear .35s ease both; }
    .progress-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); font-weight: 750; margin-bottom: 12px; }
    .progress-meta strong { color: var(--primary); }
    .progress-track { width: 100%; height: 8px; background: #eeecf7; border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg,var(--primary),#bc84e9); border-radius: inherit; transition: width .35s ease; }
    .question-label { font-size: 11px; letter-spacing: 1.6px; color: var(--primary); font-weight: 900; margin: 31px 0 9px; text-transform: uppercase; }
    .question { font-size: clamp(23px,3.1vw,31px); letter-spacing: -.8px; line-height: 1.22; margin-bottom: 8px; }
    .question-help { font-size: 14px; color: var(--muted); margin-bottom: 25px; }
    .options { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
    .option { border: 1.5px solid #e8e7f1; min-height: 95px; background: #fff; border-radius: 18px; padding: 17px; text-align: left; display: flex; align-items: center; gap: 14px; transition: border-color .18s, background .18s, transform .18s; }
    .option:not(.selected):hover { background: #fbfaff; border-color: #bcb1f4; transform: translateY(-2px); }
    .option.selected { border-color: var(--primary); background: #f5f2ff; box-shadow: inset 0 0 0 1px var(--primary); }
    .option-icon { background: #f4f1ff; font-size: 23px; display: grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; flex: 0 0 48px; }
    .option.selected .option-icon { background: #e7deff; }
    .option-copy { flex: 1; min-width: 0; }
    .option strong { font-size: 14px; display: block; }
    .option small { font-size: 11px; color: var(--muted); display: block; margin-top: 3px; }
    .check { border: 1px solid #d8d6e7; color: transparent; width: 21px; height: 21px; flex: 0 0 21px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 11px; }
    .selected .check { background: var(--primary); color: white; border-color: var(--primary); }
    .quiz-controls { display: flex; justify-content: space-between; gap: 12px; margin-top: 29px; }
    .quiz-controls .btn { min-width: 137px; }
    .result-area { max-width: 920px; margin: 15px auto 75px; }
    .result-intro { text-align: center; margin: 0 0 24px; }
    .result-intro h2 { font-size: clamp(29px,4.5vw,43px); letter-spacing: -1.6px; margin-bottom: 7px; }
    .result-intro p { color: var(--muted); }
    .result-grid { display: grid; grid-template-columns: minmax(0,.9fr) minmax(0,1.1fr); gap: 30px; align-items: center; }
    .product-visual { min-height: 350px; border-radius: 22px; background: radial-gradient(circle at 30% 20%, #fff9, transparent 46%), linear-gradient(140deg,#e7e1ff,#e0f8f1); overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; }
    .product-visual img { display: block; max-width: 100%; width: 100%; height: 350px; object-fit: cover; }
    .placeholder-bottle { width: 150px; height: 212px; background: linear-gradient(95deg,#d6c4ed,#fff 46%,#c4b7e5); border: 3px solid #faf7ff; box-shadow: 14px 24px 25px #8876a744, inset -11px 0 22px #a48fcb44; border-radius: 22px 22px 30px 30px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transform: rotate(-7deg); }
    .placeholder-bottle::before { content: ""; width: 67px; height: 32px; background: linear-gradient(90deg,#9680bf,#d4c7ea,#9f8acb); border-radius: 8px 8px 0 0; position: absolute; bottom: calc(100% - 2px); }
    .placeholder-bottle strong { font-size: 14px; letter-spacing: 1px; max-width: 115px; }
    .placeholder-bottle span { margin-top: 8px; color: #82749e; font-size: 9px; font-weight: 900; letter-spacing: 1.8px; }
    .placeholder-note { position: absolute; left: 14px; bottom: 14px; background: #fffdfd; padding: 7px 10px; border: 1px dashed #c3badc; color: #74718b; border-radius: 8px; font-size: 10px; }
    .score-row { display: flex; gap: 15px; align-items: center; margin-bottom: 17px; }
    .score-ring { width: 112px; height: 112px; border-radius: 50%; background: conic-gradient(var(--primary) 0% var(--score),#eae8f3 var(--score) 100%); display: grid; place-items: center; flex: 0 0 112px; transition: background .2s; }
    .score-ring::before { content: ""; position: absolute; }
    .score-inner { width: 91px; height: 91px; border-radius: 50%; background: white; display: flex; align-items: center; justify-content: center; flex-direction: column; line-height: 1; }
    .score-inner strong { font-size: 30px; color: var(--primary); letter-spacing: -1.4px; }
    .score-inner small { font-size: 10px; margin-top: 5px; color: var(--muted); font-weight: 750; }
    .match-text strong { color: #16a67e; display: block; font-size: 12px; margin-bottom: 4px; }
    .match-text h3 { font-size: clamp(22px,2.9vw,31px); line-height: 1.16; letter-spacing: -1px; margin-bottom: 5px; }
    .match-text p { color: var(--muted); font-size: 12px; margin: 0; }
    .result-desc { color: #676c82; font-size: 14px; line-height: 1.75; margin-bottom: 16px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .chip { border-radius: 30px; background: #f2f1fb; padding: 7px 11px; color: #514c80; font-size: 11px; font-weight: 750; }
    .price { display: flex; align-items: baseline; gap: 10px; margin-bottom: 16px; }
    .price strong { font-size: 29px; letter-spacing: -1px; }
    .price del { color: #a0a1b2; font-size: 15px; }
    .offer { background: linear-gradient(95deg,#f2eeff,#eaf9f3); border: 1px dashed #c5b7ed; border-radius: 16px; padding: 15px 17px; margin-bottom: 17px; }
    .offer strong { font-size: 13px; display: block; }
    .offer p { margin: 4px 0 0; font-size: 12px; color: #726b91; }
    .offer-code { display: inline-block; font-weight: 900; color: var(--primary); padding: 4px 9px; background: #fff; border-radius: 6px; border: 1px dashed var(--primary); margin-top: 9px; font-size: 13px; letter-spacing: 1px; }
    .result-actions { display: grid; gap: 9px; }
    .result-actions .btn { width: 100%; }
    .result-disclaimer { color: #9395a7; font-size: 11px; margin: 10px 0 0; }
    .rankings { margin: 20px 0 0; }
    .rankings h3 { font-size: 17px; margin-bottom: 12px; }
    .rank-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
    .rank-item { padding: 17px; border-radius: 17px; border: 1px solid var(--line); background: #fff; display: flex; align-items: center; gap: 11px; }
    .rank-bubble { min-width: 56px; height: 56px; border-radius: 15px; background: #eeeaff; color: var(--primary); display: grid; place-items: center; font-size: 18px; font-weight: 900; }
    .rank-item strong { font-size: 13px; display: block; }
    .rank-item small { color: var(--muted); font-size: 11px; }
    .note { font-size: 11px; color: #989aac; margin: 15px 0 0; text-align: center; }
    .footer { border-top: 1px solid #e9eaf1; padding: 21px 0 28px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 11px; color: #9295a5; }
    .footer b { color: #53556b; }
    .tiny-toast { position: fixed; left: 50%; bottom: 25px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 50; background: #22243b; color: #fff; font-size: 13px; padding: 12px 17px; border-radius: 12px; transition: opacity .2s,transform .2s; box-shadow: 0 10px 30px #22243b44; }
    .tiny-toast.show { opacity: 1; transform: translate(-50%, 0); }
    @keyframes float { 0%,100% { transform: translateY(0) rotate(-9deg); } 50% { transform: translateY(-13px) rotate(-7deg); } }
    @keyframes appear { from { opacity: 0; transform: translateY(13px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 860px) { .hero { grid-template-columns: 1fr 1fr; gap: 19px; } .hero h1 { font-size: clamp(40px,5.4vw,52px); letter-spacing: -2.3px; } .hero-art { min-height: 420px; } .float-small { left: 7px; } .float-match { right: 8px; } }
    @media (max-width: 690px) { .wrap { width: min(100% - 28px,520px); } .nav { min-height: 75px; } .pill { font-size: 10px; padding: 8px 10px; } .hero { grid-template-columns: 1fr; padding: 10px 0 25px; gap: 7px; } .hero-copy { padding: 25px 1px 13px; } .hero h1 { font-size: clamp(41px,10vw,58px); letter-spacing: -2.8px; } .hero-lead { font-size: 15px; } .hero-art { min-height: 330px; border-radius: 26px; } .hero-art::before { transform: scale(.83); } .float-small { top: 60px; } .float-match { bottom: 20px; } .bottle { transform: scale(.85) rotate(-9deg); } .instructions { grid-template-columns: 1fr; gap: 9px; margin-bottom: 35px; } .instruction { padding: 11px 15px; } .section-center, .result-area { margin-bottom: 42px; } .options { grid-template-columns: 1fr; gap: 10px; } .option { min-height: 80px; padding: 12px 13px; } .quiz-card, .result-card { border-radius: 21px; } .quiz-controls .btn { min-width: auto; } .result-grid { grid-template-columns: 1fr; gap: 24px; } .product-visual { min-height: 270px; } .product-visual img { height: 270px; } .rank-grid { grid-template-columns: 1fr; } .footer { padding-bottom: 30px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }
  </style>
</head>

      },
      {
        id: "concern", title: "Apa fokus utama rutin anda?", help: "Pilih satu keutamaan yang paling penting.",
        options: [
          { value: "jerawat", label: "Kulit mudah berjerawat", note: "Fokus keseimbangan rutin", icon: "✨" },
          { value: "kering", label: "Kurang kelembapan", note: "Fokus hidrasi", icon: "💦" },
          { value: "kusam", label: "Kulit nampak kusam", note: "Inginkan penampilan segar", icon: "☀️" },
          { value: "kemerahan", label: "Mudah kemerahan", note: "Utamakan rasa selesa", icon: "🌸" }
        ]
      },
      {
        id: "texture", title: "Tekstur mana yang anda suka?", help: "Padanan juga mengambil kira pengalaman memakai produk.",
        options: [
          { value: "gel", label: "Gel", note: "Ringan dan segar", icon: "🫧" },
          { value: "serum", label: "Serum", note: "Cair dan mudah disapu", icon: "🧪" },
          { value: "krim", label: "Krim", note: "Lebih berkrim", icon: "🧴" },
          { value: "bebas", label: "Tiada pilihan", note: "Terbuka kepada semua", icon: "💜" }
        ]
      },
      {
        id: "budget", title: "Bajet pilihan anda?", help: "Supaya cadangan kami bersesuaian dengan perbelanjaan anda.",
        options: [
          { value: "60", label: "Bawah RM60", note: "Pilihan lebih jimat", icon: "🌱" },
          { value: "100", label: "Sehingga RM100", note: "Nilai yang seimbang", icon: "🎯" },
          { value: "150", label: "Sehingga RM150", note: "Lebih banyak pilihan", icon: "💎" },
          { value: "bebas", label: "Bajet fleksibel", note: "Utamakan padanan", icon: "⭐" }
        ]
      }
    ];

    const app = document.getElementById("app");
    const state = { screen: "hero", step: 0, answers: {} };
    const escapeHTML = value => String(value ?? "").replace(/[&<>"']/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[ch]);
    const RM = number => new Intl.NumberFormat("ms-MY", { style: "currency", currency: "MYR", maximumFractionDigits: 0 }).format(Number(number) || 0);
    const isImagePath = src => /^(https?:\/\/|\.\.?\/|[a-zA-Z0-9_-]+\/|[a-zA-Z0-9_-]+\.(png|jpe?g|webp|gif|svg)$)/i.test(src || "");
    const labelFor = (id, value) => QUESTIONS.find(q => q.id === id)?.options.find(o => o.value === value)?.label || value;

    function setBrand() {
      const { brand, campaign } = CONFIG;
      for (const [key, value] of [["--primary",brand.primaryColor],["--primary-deep",brand.primaryDeep],["--primary-soft",brand.primarySoft]]) {
        if (window.CSS && CSS.supports("color", value)) document.documentElement.style.setProperty(key, value);
      }
      const logo = isImagePath(brand.logoUrl) ? `<img src="${escapeHTML(brand.logoUrl)}" alt="Logo ${escapeHTML(brand.name)}" />` : escapeHTML(brand.name.slice(0,1));
      document.getElementById("brandHeader").innerHTML = `<span class="brand-icon">${logo}</span><span>${escapeHTML(brand.name)}<small>${escapeHTML(brand.tagline)}</small></span>`;
      document.getElementById("campaignHeader").textContent = campaign.badge;
      document.getElementById("footerBrand").textContent = brand.name;
      document.getElementById("year").textContent = new Date().getFullYear();
      document.title = `${brand.name} — Product Match`;
    }

    function heroView() {
      const c = CONFIG.campaign;
      const full = c.headline;
      const head = c.highlight && full.includes(c.highlight)
        ? `${escapeHTML(full.split(c.highlight)[0])}<span class="gradient-text">${escapeHTML(c.highlight)}</span>${escapeHTML(full.split(c.highlight).slice(1).join(c.highlight))}`
        : escapeHTML(full);
      return `
        <section class="hero" aria-labelledby="heroTitle">
          <div class="hero-copy">
            <p class="eyebrow">✦ Product match experience</p>
            <h1 id="heroTitle">${head}</h1>
            <p class="hero-lead">${escapeHTML(c.description)}</p>
            <button class="btn btn-primary" data-action="start">${escapeHTML(c.heroButton)} <span aria-hidden="true">↗</span></button>
            <p class="subtext">✓ 4 soalan mudah &nbsp; ✓ Tanpa pendaftaran &nbsp; ✓ Hasil segera</p>
          </div>
          <div class="hero-art" aria-label="Ilustrasi produk skincare contoh">
            <div class="hero-top-label">PERSONALISED FOR YOU / 01</div>
            <div class="bottle" aria-hidden="true"><div class="bottle-cap"></div><div class="bottle-body"><span>GENTLE CARE</span><i></i><strong>${escapeHTML(CONFIG.brand.name)}</strong><span>YOUR SKIN · YOUR PICK</span></div></div>
            <div class="float-card float-small"><span>✦</span><div><strong style="display:block;font-size:12px">Pilihan peribadi</strong><small>4 langkah ringkas</small></div></div>
            <div class="float-card float-match"><small>Contoh padanan</small><strong>${Number(c.exampleMatch) || 94}%</strong><small>Produk yang mungkin sesuai ✨</small></div>
          </div>
        </section>
        <section class="instructions" aria-label="Cara bermain">
          <div class="instruction"><span class="step-number">01</span><div><strong>Jawab 4 soalan</strong><small>Tentang keperluan anda</small></div></div>
          <div class="instruction"><span class="step-number">02</span><div><strong>Lihat % padanan</strong><small>Dikira daripada jawapan</small></div></div>
          <div class="instruction"><span class="step-number">03</span><div><strong>Buka tawaran</strong><small>Terus berhubung di WhatsApp</small></div></div>
        </section>`;
    }

    function quizView() {
      const q = QUESTIONS[state.step];
      const selected = state.answers[q.id];
      const width = (state.step / QUESTIONS.length) * 100;
      return `<section class="section-center">
        <header class="section-heading"><p class="eyebrow">Kenali padanan anda</p><h2>Beberapa pilihan, satu cadangan.</h2><p>Tekan jawapan yang paling sesuai dengan anda.</p></header>
        <div class="quiz-card">
          <div class="progress-meta"><span>LANGKAH ${state.step + 1} DARIPADA ${QUESTIONS.length}</span><strong>${Math.round(width)}% selesai</strong></div>
          <div class="progress-track" role="progressbar" aria-label="Kemajuan kuiz" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${width}"><div class="progress-fill" style="width:${width}%"></div></div>
          <p class="question-label">SOALAN ${String(state.step + 1).padStart(2,"0")}</p>
          <h2 class="question">${escapeHTML(q.title)}</h2><p class="question-help">${escapeHTML(q.help)}</p>
          <div class="options" role="group" aria-label="${escapeHTML(q.title)}">
            ${q.options.map((o,i) => `<button type="button" id="choice-${i}" class="option ${selected === o.value ? "selected" : ""}" data-choice="${escapeHTML(o.value)}" aria-pressed="${selected === o.value}">
              <span class="option-icon" aria-hidden="true">${o.icon}</span><span class="option-copy"><strong>${escapeHTML(o.label)}</strong><small>${escapeHTML(o.note)}</small></span><span class="check" aria-hidden="true">✓</span>
            </button>`).join("")}
          </div>
          <div class="quiz-controls">
            <button class="btn btn-outline" data-action="back">← ${state.step === 0 ? "Mula semula" : "Kembali"}</button>
            <button class="btn btn-primary" data-action="next" ${selected ? "" : "disabled"}>${state.step === QUESTIONS.length - 1 ? "Lihat Padanan ✨" : "Seterusnya →"}</button>
          </div>
        </div>
        <p class="note">Padanan dikira daripada jenis kulit, fokus rutin, tekstur dan bajet.</p>
      </section>`;
    }

    // Skor ilustrasi: 30 mata jenis kulit + 35 fokus + 18 tekstur + 11 bajet = maks. 94.
    // Ini ialah indeks pemasaran berdasarkan pilihan pengguna, BUKAN bukti klinikal.
    function scoreProduct(product) {
      const a = state.answers;
      const breakdown = {
        skin: product.skin.includes(a.skin) ? 30 : 0,
        concern: product.concerns.includes(a.concern) ? 35 : 0,
        texture: a.texture === "bebas" || product.textures.includes(a.texture) ? 18 : 0,
        budget: 0
      };
      if (a.budget === "bebas") breakdown.budget = 11;
      else if (product.price <= Number(a.budget)) breakdown.budget = 11;
      else if (product.price <= Number(a.budget) + 25) breakdown.budget = 5;
      return { product, breakdown, score: Object.values(breakdown).reduce((a,b) => a+b,0) };
    }

    function rankProducts() {
      return CONFIG.products.map(scoreProduct).sort((a,b) => b.score - a.score || a.product.price - b.product.price);
    }

    function productImage(product) {
      if (isImagePath(product.image)) return `<img src="${escapeHTML(product.image)}" alt="${escapeHTML(product.name)}" />`;
      return `<div class="placeholder-bottle" aria-label="Placeholder gambar produk"><strong>${escapeHTML(CONFIG.brand.name)}</strong><span>PRODUCT IMAGE</span></div><span class="placeholder-note">PLACEHOLDER GAMBAR · UBAH CONFIG.products[].image</span>`;
    }

    function normalisePhone(phone) {
      let digits = String(phone || "").replace(/\D/g, "");
      if (digits.startsWith("0")) digits = "60" + digits.slice(1);
      return /^\d{9,15}$/.test(digits) ? digits : "";
    }

    function whatsappLink(product, score) {
      const number = normalisePhone(CONFIG.whatsapp.number);
      const choices = QUESTIONS.map(q => `${q.title} ${labelFor(q.id, state.answers[q.id])}`).join("\n");
      const message = `${CONFIG.campaign.whatsappIntro}\n\nProduk: ${product.name}\nPadanan indikatif: ${score}%\nHarga dipaparkan: ${RM(product.price)}\nKod kempen: ${CONFIG.campaign.promoCode}\n\nPilihan saya:\n${choices}\n\nBoleh saya dapatkan maklumat tawaran dan cara pembelian?`;
      return number ? `https://wa.me/${number}?text=${encodeURIComponent(message)}` : "";
    }

    function resultView() {
      const ranked = rankProducts();
      const { product:p, score, breakdown:b } = ranked[0];
      const c = CONFIG.campaign;
      const wa = whatsappLink(p, score);
      return `<section class="result-area" aria-labelledby="resultTitle">
        <header class="result-intro"><p class="eyebrow">✦ RESULT UNLOCKED</p><h2 id="resultTitle">Padanan anda sudah ditemui!</h2><p>Ini produk yang paling sepadan dengan 4 pilihan anda.</p></header>
        <article class="result-card">
          <div class="result-grid">
            <div class="product-visual">${productImage(p)}</div>
            <div>
              <div class="score-row">
                <div class="score-ring" id="scoreRing" style="--score:${score}%"><div class="score-inner"><strong id="scoreValue">${score}%</strong><small>MATCH</small></div></div>
                <div class="match-text"><strong>✓ CADANGAN TERATAS</strong><h3>${escapeHTML(p.name)}</h3><p>${escapeHTML(p.subtitle)}</p></div>
              </div>
              <p class="result-desc">${escapeHTML(p.description)}</p>
              <div class="chips">${p.benefits.map(t => `<span class="chip">✓ ${escapeHTML(t)}</span>`).join("")}</div>
              <div class="price"><strong>${RM(p.price)}</strong>${p.originalPrice > p.price ? `<del>${RM(p.originalPrice)}</del>` : ""}</div>
              <div class="offer"><strong>🎁 ${escapeHTML(c.reward)}</strong><p>${escapeHTML(c.discountText)} · Sehingga ${escapeHTML(c.expiry)}</p><span class="offer-code">${escapeHTML(c.promoCode)}</span></div>
              <div class="result-actions">
                ${wa ? `<a class="btn btn-whatsapp" href="${escapeHTML(wa)}" target="_blank" rel="noopener noreferrer" id="convertCTA">◉ ${escapeHTML(c.ctaText)} ↗</a>` : `<button class="btn btn-whatsapp" disabled title="Isi nombor WhatsApp dalam CONFIG">Isi nombor WhatsApp dalam CONFIG</button>`}
                <button class="btn btn-outline" data-action="restart">↻ Main Semula</button>
              </div>
              <p class="result-disclaimer">${escapeHTML(c.terms)} Skor ialah anggaran berdasarkan pilihan, bukan jaminan kesan produk.</p>
            </div>
          </div>
        </article>
        <div class="rankings"><h3>Pilihan alternatif untuk anda</h3><div class="rank-grid">
          ${ranked.slice(1,3).map(r => `<div class="rank-item"><span class="rank-bubble">${r.score}%</span><div><strong>${escapeHTML(r.product.name)}</strong><small>${RM(r.product.price)} · Alternatif berdasarkan jawapan anda</small></div></div>`).join("")}
        </div></div>
        <p class="note">Kaedah skor: jenis kulit (30), fokus (35), tekstur (18), bajet (11); maksimum 94%. Sila semak ramuan dan lakukan ujian tampalan apabila sesuai.</p>
      </section>`;
    }

    function render() {
      app.innerHTML = state.screen === "hero" ? heroView() : state.screen === "quiz" ? quizView() : resultView();
    }

    function switchScreen(screen) {
      state.screen = screen;
      render();
      window.scrollTo({ top: 0, behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    }

    app.addEventListener("click", (event) => {
      const choice = event.target.closest("[data-choice]");
      if (choice && state.screen === "quiz") {
        const value = choice.dataset.choice;
        const choiceId = choice.id;
        state.answers[QUESTIONS[state.step].id] = value;
        render();
        document.getElementById(choiceId)?.focus({ preventScroll: true });
        return;
      }
      const button = event.target.closest("[data-action]");
      if (!button || button.disabled) return;
      const action = button.dataset.action;
      if (action === "start") { state.step = 0; state.answers = {}; switchScreen("quiz"); }
      if (action === "next") {
        if (!state.answers[QUESTIONS[state.step].id]) return;
        if (state.step < QUESTIONS.length - 1) { state.step++; switchScreen("quiz"); }
        else switchScreen("result");
      }
      if (action === "back") {
        if (state.step > 0) { state.step--; switchScreen("quiz"); }
        else switchScreen("hero");
      }
      if (action === "restart") { state.step = 0; state.answers = {}; switchScreen("hero"); }
    });

    setBrand();
    render();
  </script>
</body>
</html>
